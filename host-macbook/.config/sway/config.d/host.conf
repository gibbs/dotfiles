# MacBook (Apple Silicon, Asahi): Retina panel, keyboard and touchpad

### Outputs / HiDPI
# Retina panel. `swaymsg -t get_outputs` lists names and modes.
output eDP-1 scale 2

seat seat0 xcursor_theme Adwaita 24

### Input (MacBook)
input type:keyboard {
    xkb_layout gb
    xkb_variant mac
    repeat_delay 300
    repeat_rate 40
}

input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
    # two finger click = right click, three = middle (macOS style)
    click_method clickfinger
    accel_profile adaptive
}

exec_always {
    gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita'
    gsettings set org.gnome.desktop.interface cursor-size 24
}

# Laptop panel first, external display (USB-C) second
workspace 1 output eDP-1
workspace 2 output eDP-1
workspace 3 output eDP-1
workspace 4 output eDP-1
workspace 5 output eDP-1
workspace 6 output DP-1 DP-2 HDMI-A-1 eDP-1
workspace 7 output DP-1 DP-2 HDMI-A-1 eDP-1
workspace 8 output DP-1 DP-2 HDMI-A-1 eDP-1
workspace 9 output DP-1 DP-2 HDMI-A-1 eDP-1
workspace 10 output DP-1 DP-2 HDMI-A-1 eDP-1
