# Read by systemd --user and the display manager at login.

# Prefer native Wayland, fall back to XWayland
QT_QPA_PLATFORM=wayland;xcb
QT_QPA_PLATFORMTHEME=gnome
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
ELECTRON_OZONE_PLATFORM_HINT=auto
SDL_VIDEODRIVER=wayland,x11
CLUTTER_BACKEND=wayland

# Java (dbeaver) renders blank windows under tiling compositors without this
_JAVA_AWT_WM_NONREPARENTING=1

# HiDPI: compositor handles scaling, keep toolkits at 1x
GDK_SCALE=1
QT_AUTO_SCREEN_SCALE_FACTOR=1
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24
